# Builds the Sanity Studio (techflow-cms/studio) and publishes it to
# https://cms.techflow-agency.com (nginx container in /docker/sanity-studio on the Hostinger VPS).
# The deploy key can only rsync into /docker/sanity-studio/dist (rrsync on the VPS).
name: Deploy Studio

on:
  push:
    branches: [main]
    paths: ["techflow-cms/studio/**", ".github/workflows/deploy-studio.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-studio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: techflow-cms/studio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: techflow-cms/studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish to the VPS
        env:
          DEPLOY_KEY: ${{ secrets.STUDIO_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.STUDIO_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlt --delete -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" dist/ studio-deploy@187.127.109.12:/
      - name: Check the live Studio
        run: |
          sleep 3
          curl -fsS --retry 5 --retry-delay 5 https://cms.techflow-agency.com/healthz
          curl -fsS https://cms.techflow-agency.com/ | grep -q "<html"
